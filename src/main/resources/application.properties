spring.application.name=hr_management

#MySQL Database Connection
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.url=jdbc:mysql://localhost:3306/hr_management
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server:port:8080
#change if this port number is under use in another project

#JPA
spring.jpa.hibernate.ddl-auto=update
#use create for the first time 
spring.jpa.show-sql=true
speing.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
spring.jpa.open-in-view=false
app.admin.email=${ADMIN_EMAIL:admin@zidio.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}